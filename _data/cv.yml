- title: Research Experience
  type: time_table
  contents:
    - title: Open Data Collection Playbook & Platform (Waraka)
      institution: Co-PI, Masakhane African Languages Hub Grant
      year: 2025 - Present
      description:
        - Co-leading a 15-month project building WARAKA, an open community handbook and annotation platform for collecting, annotating, and releasing text, speech, and vision datasets for African languages, with Masakhane, EthioNLP, and HausaNLP.
    - title: "POLAR: Multilingual, Multicultural, and Multi-Event Online Polarization Detection"
      institution: University of Wisconsin-Stevens Point
      year: 2025 - 2026
      description:
        - Co-developed a benchmark of 23,000+ instances across 22 languages for detecting polarization in online text, and co-organized the SemEval-2026 shared task built on it.
    - title: Modeling Annotator Disagreement in Subjective NLP Tasks
      institution: University of Wisconsin-Stevens Point
      year: 2025 - 2026
      description:
        - Agreement-based clustering approach for modeling annotator perspectives across 40 datasets in 18 languages, evaluated on sentiment, emotion, and hate speech tasks. Published in TACL (2026).
    - title: "Going PLACES: Participatory Localized Red Teaming for Text-to-Image Safety"
      institution: University of Wisconsin-Stevens Point
      year: 2024 - 2026
      description:
        - Community-centered red-teaming study of text-to-image model safety across Ghana, Nigeria, and India, producing a dataset of 26,000+ examples of model failures. Published at FAccT 2026.
    - title: "BRIGHTER: Bridging the Gap in Text-Based Emotion Detection"
      institution: Postdoctoral Research Fellow, Northeastern University
      year: Sep 2023 - 2025
      description:
        - Co-developed a human-annotated emotion dataset for 28 languages (18 African). Published at ACL 2025 (Best Resource Paper Award); organized the companion SemEval 2025 Task 11 (Best Task Paper Award).
    - title: Cultural Representations of Emotions in LLMs Through Mixed Emotion Survey
      institution: Postdoctoral Research Fellow, Northeastern University
      year: Sep 2023 - 2025
      description:
        - Studied emotion representations of Western and East Asian cultures across five LLMs against a prior human study. Published at ACII 2024 (Best Paper Award).
    - title: Exploring Cross-Cultural Alignment in LLMs Responses
      institution: Postdoctoral Research Fellow, Northeastern University
      year: Sep 2023 - Jun 2024
      description:
        - Investigated cultural and emotional alignment of ChatGPT responses with native Hausa speakers using 37 culturally validated prompts.
    - title: "AfriHate: A Multilingual Hate and Offensive Corpus for Africa"
      institution: Postdoctoral Research Fellow, Northeastern University
      year: Sep 2023 - 2024
      description:
        - Developed the first labelled hate speech dataset for 18 African languages from 6 countries, with baseline benchmarks across SOTA LLMs.
    - title: "ArtELingo-28: A Benchmark of WikiArt with Captions in 28 Languages"
      institution: Postdoctoral Research Fellow, Northeastern University
      year: Jul 2023 - 2025
      description:
        - Collected 200K emotion labels and affective captions in 25 languages on 2,000 images, benchmarking Vision-Language models for cross-lingual, cross-cultural emotion transfer.
    - title: Analyzing COVID-19 Vaccination Sentiments in Nigerian Cyberspace
      institution: Senior Lecturer, Bayero University Kano
      year: Aug 2021 - Dec 2022
      description:
        - Built and annotated a Twitter dataset on COVID-19 vaccination sentiment, benchmarking classical ML and fine-tuned LLMs (BERT, Afro-XLM-R, XLM-RoBERTa).
    - title: "NaijaSenti: A Nigerian Twitter Sentiment Corpus"
      institution: Senior Lecturer, Bayero University Kano
      year: Dec 2020 - Jul 2022
      description:
        - Developed the first large-scale, manually annotated Twitter sentiment dataset and lexicon for the four main Nigerian languages.
    - title: Purchase Intention Mining Approach for Movie Revenue Prediction
      institution: Doctoral Researcher, Universiti Kebangsaan Malaysia
      year: Mar 2016 - Apr 2020
      description:
        - "PhD dissertation research: box-office revenue prediction corpus and purchase intention lexicon from movie trailer reviews, evaluated against MLR, SVM, MLP, and RF models."

